# PT Pocket —— NAS 部署用 compose
#
#   docker compose pull && docker compose up -d
#
# 所有可变项都在 .env 里（从 .env.example 复制）。默认不含 qBittorrent，
# 因为 NAS 上通常已经装过了；没有的话加 --profile qbit 一起拉起来：
#
#   docker compose --profile qbit up -d
#
# 想在本机改代码后自己构建镜像，叠加 build 覆盖文件：
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

services:
  ptpocket:
    # 默认用本项目发布的公开镜像；fork 自建时在 .env 里改成自己的
    image: ${PTPOCKET_IMAGE:-douge/ptpocket:latest}
    container_name: ptpocket
    restart: unless-stopped
    # 刻意逐项显式映射，而不是用 env_file。原因：
    #   - OMV 的 compose 插件把环境文件命名为 <栈名>.env（如 ptpocket.env），
    #     不是 .env，写死 `env_file: .env` 在 OMV 上会找不到文件
    #   - 用 `env_file: [{path, required: false}]` 能兼容两者，但那语法要求
    #     Compose >= 2.24，旧版 Docker 会直接语法报错 —— NAS 上版本参差不齐，赌不起
    # 变量替换（${VAR}）在所有 Compose 版本、以及 --env-file 与 .env 两种来源下都成立。
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # 访问控制
      - APP_PASSWORD=${APP_PASSWORD:?请在环境文件里设置 APP_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET:?请用 openssl rand -hex 32 生成 SESSION_SECRET}
      - SESSION_DAYS=${SESSION_DAYS:-30}
      # Prowlarr
      - PROWLARR_URL=${PROWLARR_URL:-http://prowlarr:9696}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY:?请填 Prowlarr 的 API Key}
      # M-Team（留空即不启用）
      - MTEAM_API_KEY=${MTEAM_API_KEY:-}
      - MTEAM_URL=${MTEAM_URL:-https://kp.m-team.cc}
      - MTEAM_API_URL=${MTEAM_API_URL:-}
      - MTEAM_MODE=${MTEAM_MODE:-normal}
      # qBittorrent
      - QB_URL=${QB_URL:?请填 qBittorrent 的地址}
      - QB_USERNAME=${QB_USERNAME:-}
      - QB_PASSWORD=${QB_PASSWORD:-}
      - QB_INSECURE_TLS=${QB_INSECURE_TLS:-false}
      - QB_DEFAULT_CATEGORY=${QB_DEFAULT_CATEGORY:-}
      - QB_DEFAULT_TAGS=${QB_DEFAULT_TAGS:-}
      - QB_DEFAULT_SAVEPATH=${QB_DEFAULT_SAVEPATH:-}
      # 其他
      - SEARCH_TIMEOUT_MS=${SEARCH_TIMEOUT_MS:-45000}
      - SEARCH_LIMIT=${SEARCH_LIMIT:-100}
      - TRUST_PROXY=${TRUST_PROXY:-true}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      # 唯一需要对外的端口。务必套 HTTPS 再暴露到公网（见 README）。
      # 若用 Cloudflare Tunnel，把这段整体注释掉即可 —— tunnel 容器在同一
      # 网络内直接访问 ptpocket:8787，公网零入站端口。
      - "${PTPOCKET_BIND:-0.0.0.0}:${PTPOCKET_PORT:-8787}:8787"
    # 让容器能用 http://host.docker.internal:<端口> 访问宿主机上已有的 qBittorrent，
    # 省得去查 NAS 的内网 IP。qB 若和本 compose 一起跑，直接用服务名 qbittorrent 即可。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      prowlarr:
        condition: service_started
    networks: [ptnet]

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      # 上游没收录的站点，把自定义 Cardigann 定义丢进
      # ${DATA_DIR}/prowlarr/Definitions/Custom/ 即可
      - ${DATA_DIR:-./data}/prowlarr:/config
    ports:
      # ⚠ 绝不要把这个端口暴露到公网 —— Prowlarr 的 API Key 等于你所有 PT 站的登录态。
      #
      # ptpocket 是走内部网络用服务名 prowlarr:9696 访问它的，跟这里发布的端口无关。
      # 所以这个映射只是给你的浏览器做初始配置用。配完之后建议二选一：
      #   1. 把下面这行注释掉（最安全，需要改配置时再临时打开）
      #   2. 在 .env 里设 PROWLARR_BIND=127.0.0.1，只允许 NAS 本机访问
      #      （远程改配置时用 SSH 端口转发：ssh -L 9696:127.0.0.1:9696 nas）
      - "${PROWLARR_BIND:-0.0.0.0}:${PROWLARR_PORT:-9696}:9696"
    networks: [ptnet]

  # 过 Cloudflare 五秒盾。国内站基本都挂了 CF，建议保留。
  # Prowlarr 里填 http://flaresolverr:8191/
  #
  # 刻意不发布 8191 端口：它本质是个可被驱使去访问任意网址的无头浏览器，
  # 暴露出去等于开放代理。只在内部网络可达就够了。
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=warning
      - TZ=${TZ:-Asia/Shanghai}
    networks: [ptnet]

  # 仅在 --profile qbit 时启动。已有 qBittorrent 的话别开，
  # 直接在 .env 里把 QB_URL 指向它。
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    profiles: [qbit]
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ${DATA_DIR:-./data}/qbittorrent:/config
      - ${DOWNLOADS_DIR:-./data/downloads}:/downloads
    ports:
      - "${QB_PORT:-8080}:8080"
      - "6881:6881"
      - "6881:6881/udp"
    networks: [ptnet]

  # 推荐的外网访问方式：零入站端口、自带 HTTPS，不用管 DDNS 和证书。
  # 取消注释并在 .env 里填 CF_TUNNEL_TOKEN（Cloudflare Zero Trust 创建 Tunnel 后获得），
  # 然后在 Tunnel 的 Public Hostname 里指向 http://ptpocket:8787。
  # 同时可以把 ptpocket 的 ports 段整体注释掉，一个端口都不用开。
  #
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: cloudflared
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
  #   networks: [ptnet]

networks:
  ptnet:
    driver: bridge
