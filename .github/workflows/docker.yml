name: 构建并推送 Docker 镜像

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: # 只改文档时不必重新出镜像
      - "**.md"
      - "LICENSE"
  workflow_dispatch: # 允许在 Actions 页面手动触发

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ptpocket

jobs:
  test:
    name: 冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 不指定 version，交给 package.json 的 packageManager 字段决定，
      # 否则两处版本会冲突报错
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node test/check-compose-env.mjs
      - run: pnpm typecheck
      - run: pnpm build
      # 全 mock，不需要真实的 Prowlarr / qBittorrent / M-Team 账号
      - run: ./test/run.sh

  build:
    name: 构建 ${{ matrix.arch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          # 公开仓库可以免费用原生 arm64 runner。
          # 用原生构建而不是 QEMU 模拟，省掉十几分钟，也不必给 Dockerfile
          # 加 --platform=$BUILDPLATFORM（那会让旧版 Docker 无法本地构建）。
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      # 没配 secret 时给一句人话，而不是让 docker 报一堆看不懂的错
      - name: 检查 Docker Hub 凭据
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::缺少 Docker Hub 凭据。请到 Settings → Secrets and variables → Actions 添加 DOCKERHUB_USERNAME 和 DOCKERHUB_TOKEN（token 权限选 Read & Write）。"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 各架构先只按 digest 推送，不打 tag，最后统一合并成 manifest list
      - name: 构建并按 digest 推送
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: 导出 digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: 合并多架构 manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: 合并并推送 manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: 校验 manifest 含两种架构
        run: |
          TAG=$(jq -r '.tags[0]' <<< '${{ steps.meta.outputs.json }}')
          docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' \
            | jq -r '.manifests[]? | "\(.platform.os)/\(.platform.architecture)"' | sort -u | tee /tmp/arches
          grep -qx 'linux/amd64' /tmp/arches || { echo "缺少 linux/amd64"; exit 1; }
          grep -qx 'linux/arm64' /tmp/arches || { echo "缺少 linux/arm64"; exit 1; }
          {
            echo "### 镜像已推送 :rocket:"
            echo '```bash'
            echo "docker pull ${{ env.IMAGE }}:latest"
            echo '```'
            echo "架构：$(paste -sd', ' /tmp/arches)"
          } >> "$GITHUB_STEP_SUMMARY"
